<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0b0d" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Crypto coin, exchange and AI logos (Claude Code, Codex, OpenAI and more). Download the full set or embed from Cloudflare storage." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Trading logos: coins, exchanges and AI" />
    <meta property="og:description" content="4,687 coin logos, 330 exchange logos and AI company and harness logos in SVG, free to download and embed." />
    <meta property="og:url" content="https://logos.marketmaker.cc/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Trading logos: coins, exchanges and AI</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (!t) t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
